name: Release Packages (PyPI, npm, Homebrew, Scoop)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tests before release
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -r admin-dashboard/requirements.txt pytest httpx
          python -m pytest tests/ -v

      - name: Build Python distributions
        run: |
          python -m build
          twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Compute checksums & create GitHub Release
        run: |
          sha256sum dist/* > dist/SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Homelab OS ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
