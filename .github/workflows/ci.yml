name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test & build dependencies
        run: |
          python -m pip install --upgrade pip build wheel
          python -m pip install -r admin-dashboard/requirements.txt pytest httpx

      - name: Run pytest test suite
        run: python -m pytest tests/ -v

      - name: Build Python wheel & test isolated CLI install
        shell: bash
        run: |
          python -m build --wheel
          python -m venv .ci-venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            .ci-venv/Scripts/pip install dist/*.whl
            .ci-venv/Scripts/homelab --version
            .ci-venv/Scripts/homelab init -y --skip-daemon-check --skip-deps --dir .ci-ws
          else
            .ci-venv/bin/pip install dist/*.whl
            .ci-venv/bin/homelab --version
            .ci-venv/bin/homelab init -y --skip-daemon-check --skip-deps --dir .ci-ws
          fi
          test -f .ci-ws/.env
          test -f .ci-ws/docker-compose.yml

      - name: Verify npm package & CLI wrapper
        shell: bash
        run: |
          npm pack --dry-run
          node bin/homelab.js --version

      - name: Validate Docker Compose manifest (Linux)
        if: runner.os == 'ubuntu-latest'
        run: docker compose --env-file .ci-ws/.env -f .ci-ws/docker-compose.yml config --quiet
