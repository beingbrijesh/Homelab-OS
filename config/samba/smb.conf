# ==============================================================================
# Homelab OS (HL-OS) — Resilient Samba Server Configuration
# Optimized for: Private VPN (Tailscale/WireGuard) & Transient Network Drops
# ==============================================================================

[global]
   workgroup = WORKGROUP
   server string = Homelab Private Storage
   server role = standalone server
   security = user
   map to guest = Bad User
   dns proxy = no

   # ── Protocol & SMB3 Resiliency Settings ──────────────────────────────────
   # Enable SMB 2.1 / 3.0 durable handles so open files survive VPN drops & sleep
   server min protocol = SMB2_10
   server max protocol = SMB3_11
   smb2 leases = yes
   durable handles = yes
   kernel oplocks = no
   posix locking = no

   # ── TCP Keep-Alive & Deadtime (Fast recovery from network blips) ──────────
   deadtime = 15
   socket options = TCP_NODELAY SO_KEEPALIVE TCP_KEEPIDLE=20 TCP_KEEPINTVL=5 TCP_KEEPCNT=3

   # ── Logging & Auditing ───────────────────────────────────────────────────
   log file = /var/log/samba/%m.log
   max log size = 1000
   logging = file

   # ── macOS / Apple Finder Optimization ────────────────────────────────────
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = Macmini
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

# ── Primary Homelab Storage Share ──────────────────────────────────────────
[Storage]
   comment = Homelab Device Storage
   path = /share
   browseable = yes
   read only = no
   guest ok = no
   create mask = 0664
   directory mask = 0775
   valid users = @users, homelab
